document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    // Per-page prep: substitute UUIDs, strip SRI/crossorigin (blob URLs from a
    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.
    function resourcesFor(id) {
      var map = {};
      var list = extResources[id] || [];
      for (var k = 0; k < list.length; k++) {
        if (blobUrls[list[k].uuid]) map[list[k].id] = blobUrls[list[k].uuid];
      }
      return map;
    }
    for (const id of pageIds) {
      let t = pages[id];
      for (const uuid of uuids) t = t.split(uuid).join(blobUrls[uuid]);
      t = t.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');
      // The click interceptor owns every anchor click (not a <base target>):
      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.
      // composedPath + getAttribute('target') handle SVG <a> and shadow-DOM
      // anchors, which closest()/IDL .target get wrong.
      var headContent = 'window.__resources = ' + JSON.stringify(resourcesFor(id)) + ';' +
        (pageIds.length > 1 ?
          'window.__bundler_pages = ' + JSON.stringify(pageIds) + ';' +
          'document.addEventListener("click", function(e){' +
            'if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.defaultPrevented) return;' +
            'var a = null, p = e.composedPath ? e.composedPath() : [e.target];' +
            'for (var j = 0; j < p.length && !a; j++) {' +

              'if (tn === "A" || tn === "a" || tn === "AREA") a = n;' +
            '}' +
            'if (!a && e.target.closest) a = e.target.closest("a, area");' +
            'if (!a || a.hasAttribute("download")) return;' +
            'var tg = a.getAttribute("target");' +
            'if (tg && tg !== "_self") return;' +
            'var h = a.getAttribute("href") || a.getAttribute("xlink:href");' +
            'if (!h || /^javascript:/i.test(h)) return;' +
            'if (h.charAt(0) !== "#") {' +
              'if (!tg) { var b = document.querySelector("base[target]"); if (b && b.getAttribute("target") !== "_self") return; }' +
              'e.preventDefault();' +
              'if (/^(?:[a-z][a-z0-9+.-]*:|\\/\\/)/i.test(h)) parent.location.assign(h);' +
              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');
      // Defuse any script end-tag sequence in the content (resource ids, page
      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';
      // Inject after <head> so the DOCTYPE stays first; prepending the script
      // would push the parser into quirks mode. DOMParser always emits a <head>
      // (synthesizing one if the source HTML omitted it) but may carry
      // attributes through, so match the full opening tag.
      var headOpen = t.match(/<head[^>]*>/i);
      if (headOpen) {
        var hi = headOpen.index + headOpen[0].length;
        t = t.slice(0, hi) + headScript + t.slice(hi);
      }
      pages[id] = t;
    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM
      // before Babel before text/babel).
      var template = pages[entryId];
      const doc = new DOMParser().parseFromString(template, 'text/html');
      document.documentElement.replaceWith(doc.documentElement);
      const dead = Array.from(document.scripts);
      for (const old of dead) {
        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.
        if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }
        // Non-executable script types (text/babel, application/json, …) are
        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);
        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

; }\n\n  // ---- preview content ----\n  subject(r){ return r.trade ? this.tradeName(r.trade) : (r.short ? this.shortName(r.short) : 'TVET foundations'); }\n  excerpt(r){\n    const subj=this.subject(r), sl=subj.toLowerCase();\n    return { chapter:'Chapter 1 — Foundations', paras:[\n      `${r.title} is part of the Rwanda TVET Board competency-based curriculum for ${subj}. This opening chapter sets out what you will be able to do by the end of the module and why these skills matter in today's Rwandan workplace.`,\n      `Throughout the book, theory is paired with hands-on practice. Each section opens with a real workplace scenario, introduces the underlying principles, and then guides you through an activity you can repeat in your school workshop or while on industrial attachment.`,\n      `Before you continue, have your learner logbook ready. You will record observations, sketch diagrams, and note the safety checks that apply to ${sl}. In a competence-based programme, you demonstrate what you can do — memorisation alone is not enough.`,\n      `By the end of this chapter you should be able to describe the scope of ${sl}, list the core tools and terms used in the trade, and explain how this module connects to the qualification you are working towards.`,\n    ] };\n  }\n  videoDetail(r){\n    const subj=this.subject(r), sl=subj.toLowerCase();\n    return {\n      desc:`A step-by-step video lesson from the Rwanda TVET Board. Watch the instructor demonstrate the techniques in ${r.title}, then follow along at your own pace in the workshop.`,\n      learn:[ `Set up your workspace safely for ${sl}`, 'Follow the correct sequence of steps shown by the instructor', 'Recognise and avoid the most common beginner mistakes', 'Complete a guided practice task on your own' ],\n      chapters:[ {t:'0:00',label:'Introduction & safety brief'}, {t:'1:20',label:`Tools and materials for ${sl}`}, {t:'3:45',label:'Step-by-step demonstration'}, {t:'6:10',label:'Common mistakes to avoid'}, {t:'8:30',label:'Practice task & recap'} ],\n    };\n  }\n\n  // ---- AI reading assistant ----\n  greet(r){ return { role:'assistant', text:`Hi! I'm your reading assistant for \"${r.title}\". Ask me anything about this book — I can explain ideas, summarise sections, or quiz you on the material.` }; }\n  setChatInput(e){ this.setState({ chatInput:e.target.value }); }\n  onChatKey(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); this.sendChat(); } }\n  async sendChat(preset){\n    const text=String(preset!=null?preset:this.state.chatInput).trim();\n    if(!text || this.state.chatBusy || !this.state.modal) return;\n    const r=this.RES.find(x=>x.id===this.state.modal.id); if(!r) return;\n    const msgs=[...this.state.chat.msgs, { role:'user', text }];\n    this.setState(s=>({ chat:{ id:r.id, msgs }, chatInput:'', chatBusy:true }));\n    if(typeof window==='undefined' || !window.claude || typeof window.claude.complete!=='function'){\n      setTimeout(()=>this.setState(s=>({ chat:{ id:r.id, msgs:[...s.chat.msgs, { role:'assistant', text:'The AI Reading Assistant needs an internet connection and is not available in this offline copy of the library. Please open the online version to chat about this book.' }] }, chatBusy:false })), 400);\n      return;\n    }\n    try{\n      const subj=this.subject(r);\n      const history=msgs.slice(-8).map(m=>(m.role==='user'?'Learner: ':'Assistant: ')+m.text).join('\\n');\n      const prompt=`You are the RTB Reading Assistant, a warm, encouraging tutor inside the Rwanda TVET Board digital library. The learner is reading the book \"${r.title}\" (subject: ${subj}; publisher: ${r.pub}). Help them understand it. Answer in clear, simple English suitable for a TVET student, in 2 to 4 short sentences. Stay on the subject of this book and vocational training; if asked something off-topic, gently bring them back to the book. Do not use markdown headers, asterisks, or bullet symbols.\\n\\nConversation so far:\\n${history}\\n\\nReply as the assistant:`;\n      const reply=await window.claude.complete(prompt);\n      const out=String(reply||'').trim() || 'Sorry, I could not generate an answer just now. Please try asking again.';\n      this.setState(s=>({ chat:{ id:r.id, msgs:[...s.chat.msgs, { role:'assistant', text:out }] }, chatBusy:false }));\n    }catch(err){\n      this.setState(s=>({ chat:{ id:r.id, msgs:[...s.chat.msgs, { role:'assistant', text:'I had trouble connecting just now. Please check your connection and try asking again.' }] }, chatBusy:false }));\n    }\n  }\n\n  componentDidMount(){\n    try{\n      const h=(location.hash||'').replace(/^#/,'');\n      if(!h) return;\n      const p=new URLSearchParams(h);\n      const map={ all:'all', books:'book', audiobooks:'audio', videos:'video' };\n      const patch={};\n      const sc=p.get('screen');\n      if(sc && map[sc]) patch.view=map[sc];\n      const mid=parseInt(p.get('modal'),10);\n      if(mid){ const r=this.RES.find(x=>x.id===mid); if(r){ patch.modal={ id:mid, tab:(p.get('tab')||['book','audio','video'].find(f=>r.formats.includes(f))) }; patch.chat={ id:mid, msgs:[this.greet(r)] }; } }\n      if(Object.keys(patch).length) this.setState(patch);\n    }catch(e){}\n  }\n\n  viewChipStyle(active){\n    return active ? 'background:#fff;color:#1b1d27;box-shadow:0 2px 6px rgba(20,22,40,.1)' : 'background:transparent;color:#7c8089';\n  }\n  levelChipStyle(active){\n    const a=this.accent();\n    return active\n      ? `background:${a};color:#fff;box-shadow:0 3px 9px ${a}40`\n      : 'background:#f0f0f4;color:#6a6e78';\n  }\n\n  buildCard(r, type, i){\n    const tintKey=r.trade || (r.short ? 'short' : 'other');\n    const tint=this.TINT[tintKey] || this.TINT.other;\n    const fmt=this.FMT[type] || this.FMT.book;\n    const card={ id:r.id, title:r.title, pub:r.pub, delay:(i*0.04).toFixed(2)+'s',\n      isBook:type==='book', isAudio:false, isVideo:type==='video',\n      fmtColor:fmt.color, fmtShadow:fmt.color+'55',\n      metaLabel: r.trade ? (this.tradeName(r.trade)+(r.level? ' · '+this.levelName(r.level):'')) : (r.short ? this.shortName(r.short) : 'General'),\n      flags:[], hasFlags:false,\n      stopProp:(e)=>e.stopPropagation(),\n      onOpen:()=>this.openCard(r.id) };\n    if(type==='book'){\n      card.slotId='cover-'+r.id;\n      card.imgSrc=this.imgUrl(r.id,false,r.kw);\n      card.noCover=this.NOCOVER.has(r.id);\n      card.coverBg=`linear-gradient(150deg,${tint[0]},${tint[1]})`;\n      const flags=[];\n      if(r.formats.includes('audio')) flags.push({ label:'Audiobook', color:this.FMT.audio.color, soft:this.FMT.audio.soft, isAudio:true, isVideo:false });\n      if(r.formats.includes('video')) flags.push({ label:'Video tutorial', color:this.FMT.video.color, soft:this.FMT.video.soft, isAudio:false, isVideo:true });\n      card.flags=flags; card.hasFlags=flags.length>0;\n    } else {\n      card.slotId='vthumb-'+r.id;\n      card.imgSrc=this.imgUrl(r.id,true,r.kw);\n      card.durLabel=this.vidLen(r.id);\n    }\n    return card;\n  }\n\n  renderVals(){\n    const s=this.state, a=this.accent();\n    const accentSoft=a+'16', accentDeep=a, accentShadow=a+'4d';\n    const scale=this.props.density==='Compact'?0.86:1;\n    const R=n=>Math.round(n*scale)+'px';\n    const bookW=Math.round(170*scale), bookH=Math.round(228*scale);\n    const videoW=Math.round(306*scale), videoH=Math.round(videoW*9/16);\n    const audioW=Math.round(204*scale);\n\n    const hasNav = Object.values(s.nav).some(Boolean) || Object.values(s.shortNav).some(Boolean);\n    const q = s.query.trim().toLowerCase();\n    const navPass=(r)=>{ if(!hasNav) return true; if(r.short) return !!s.shortNav[r.short]; if(r.trade==null) return false; return !!s.nav[`${r.trade}:${r.level}`]; };\n    const viewPass=(r)=>{ if(s.view==='all') return true; return r.formats.includes(s.view); };\n    const searchPass=(r)=>{\n      const grp = r.trade ? this.tradeName(r.trade) : (r.short ? this.shortName(r.short) : '');\n      const textOk = q==='' || r.title.toLowerCase().includes(q) || r.pub.toLowerCase().includes(q) || grp.toLowerCase().includes(q);\n      const scopeOk = !s.scopes.length || r.formats.some(f=>s.scopes.includes(f));\n      return textOk && scopeOk;\n    };\n\n    // sidebar trades (search + 3 + more)\n    const tq=s.tradeSearch.trim().toLowerCase();\n    const tradesSearching=tq!=='';\n    const tradesFiltered=tradesSearching ? this.TRADES.filter(t=>t.name.toLowerCase().includes(tq)) : this.TRADES;\n    const tradesVisible=tradesSearching ? tradesFiltered : (s.moreTrades ? this.TRADES : this.TRADES.slice(0,3));\n    const trades=tradesVisible.map(t=>{\n      const levels=this.LEVELS.map(l=>{\n        const checked=!!s.nav[`${t.id}:${l.id}`];\n        return { id:l.id, name:l.name, mark:checked?'✓':'', color:checked?a:'#5e626d',\n          boxStyle: checked?`background:${a};border-color:${a};`:'background:#fff;border-color:#cfd2da;',\n          onToggle:()=>this.toggleLevel(t.id,l.id) };\n      });\n      const count=levels.filter(l=>l.mark).length;\n      const exp=!!s.expanded[t.id];\n      return { id:t.id, name:t.name, count, countLabel:String(count), showCount:count>0,\n        mark: count===this.LEVELS.length?'✓':(count>0?'–':''),\n        boxStyle: count>0?`background:${a};border-color:${a};`:'background:#fff;border-color:#cfd2da;',\n        nameColor: count>0?a:'#2b2e38', headerBg: count>0?accentSoft:'transparent',\n        maxH: exp?(this.LEVELS.length*36+9)+'px':'0px', rot: exp?'90deg':'0deg', levels,\n        onExpand:()=>this.toggleExpand(t.id), onHeaderToggle:()=>this.toggleTradeHeader(t.id) };\n    });\n    const showMoreTrades=!tradesSearching && this.TRADES.length>3;\n    const moreTradesLabel=s.moreTrades?'Show less':('Show '+(this.TRADES.length-3)+' more');\n    const moreTradesRot=s.moreTrades?'90deg':'0deg';\n    const noTradeMatches=tradesSearching && tradesFiltered.length===0;\n\n    // sidebar short courses (search + 3 + more)\n    const sq=s.shortSearch.trim().toLowerCase();\n    const shortsSearching=sq!=='';\n    const shortsFiltered=shortsSearching ? this.SHORTS.filter(c=>c.name.toLowerCase().includes(sq)) : this.SHORTS;\n    const shortsVisible=shortsSearching ? shortsFiltered : (s.moreShorts ? this.SHORTS : this.SHORTS.slice(0,3));\n    const shorts=shortsVisible.map(c=>{\n      const checked=!!s.shortNav[c.id];\n      return { id:c.id, name:c.name, mark:checked?'✓':'', color:checked?a:'#2b2e38',\n        bg:checked?accentSoft:'transparent',\n        boxStyle:checked?`background:${a};border-color:${a};`:'background:#fff;border-color:#cfd2da;',\n        onToggle:()=>this.toggleShortCourse(c.id) };\n    });\n    const showMoreShorts=!shortsSearching && this.SHORTS.length>3;\n    const moreShortsLabel=s.moreShorts?'Show less':('Show '+(this.SHORTS.length-3)+' more');\n    const moreShortsRot=s.moreShorts?'90deg':'0deg';\n    const noShortMatches=shortsSearching && shortsFiltered.length===0;\n\n    // view chips\n    const vDefs=[ {id:'all',label:'All',f:null}, {id:'book',label:'Books',f:'book'}, {id:'audio',label:'Audiobooks',f:'audio'}, {id:'video',label:'Videos',f:'video'} ];\n    const viewChips=vDefs.map(d=>{\n      const active=s.view===d.id;\n      return { id:d.id, label:d.label, style:this.viewChipStyle(active),\n        iconColor: active ? (d.f?this.FMT[d.f].color:a) : '#9499a2',\n        isGrid:d.id==='all', isBook:d.id==='book', isAudio:d.id==='audio', isVideo:d.id==='video',\n        onClick:()=>this.setView(d.id) };\n    });\n\n    // search scopes\n    const scopeChips=s.scopes.map(id=>({ id, label:this.FMT[id].scope, style:`background:${this.FMT[id].soft};color:${this.FMT[id].color}`, onRemove:()=>this.removeScope(id) }));\n    const scopeOptions=['book','audio','video'].map(id=>{\n      const active=s.scopes.includes(id);\n      return { id, label:this.FMT[id].scope, dot:this.FMT[id].color, mark:active?'✓':'',\n        rowBg: active?this.FMT[id].soft:'transparent',\n        boxStyle: active?`background:${this.FMT[id].color};border-color:${this.FMT[id].color};`:'background:#fff;border-color:#cfd2da;',\n        onToggle:()=>this.toggleScope(id) };\n    });\n    const scopeActive=s.scopes.length>0||s.scopeMenu;\n    const searchPlaceholder=s.scopes.length ? `Search ${s.scopes.map(x=>this.FMT[x].scope.toLowerCase()).join(', ')}…` : 'Search across books, audiobooks and videos…';\n\n    // sections\n    const sections=[]; let total=0;\n    const cardType=(r)=> (s.view==='video') ? 'video' : (s.view==='book'||s.view==='audio') ? 'book' : (r.formats.includes('book') ? 'book' : 'video');\n    const pushSection=(id,title,base,isTrade)=>{\n      if(!base.length) return;\n      total+=base.length;\n      const sel=s.sectionLevel[id]||'all';\n      const present=this.LEVELS.filter(l=> base.some(r=>r.level===l.id));\n      const showChips=isTrade && present.length>0;\n      const list=(showChips && sel!=='all') ? base.filter(r=>r.level===sel) : base;\n      const levelChips=showChips ? [{id:'all',name:'All'},...present].map(l=>({ id:l.id, label:l.name, style:this.levelChipStyle(sel===l.id), onClick:()=>this.setSectionLevel(id,l.id) })) : [];\n      sections.push({ id, title, countLabel:base.length+(base.length===1?' item':' items'), showChips, levelChips,\n        cards:list.map((r,i)=>this.buildCard(r, cardType(r), i)) });\n    };\n    this.TRADES.forEach(t=>{\n      if(!(!hasNav || this.LEVELS.some(l=>s.nav[`${t.id}:${l.id}`]))) return;\n      pushSection(t.id, t.name, this.RES.filter(r=> r.trade===t.id && navPass(r) && viewPass(r) && searchPass(r)), true);\n    });\n    this.SHORTS.forEach(c=>{\n      if(!(!hasNav || s.shortNav[c.id])) return;\n      pushSection(c.id, c.name, this.RES.filter(r=> r.short===c.id && navPass(r) && viewPass(r) && searchPass(r)), false);\n    });\n    if(!hasNav){\n      pushSection('other','Other Resources', this.RES.filter(r=> r.trade==null && !r.short && navPass(r) && viewPass(r) && searchPass(r)), false);\n    }\n\n    // modal\n    let modal={ open:false };\n    let chatMsgs=[], chatShowSuggestions=false;\n    const chatSuggestions=['Summarise the key ideas','What will I learn here?','Explain the hardest part simply','Quiz me with 3 questions'].map(q=>({ label:q, onClick:()=>this.sendChat(q) }));\n    if(s.modal){\n      const r=this.RES.find(x=>x.id===s.modal.id);\n      const tabs=['book','audio','video'].filter(f=>r.formats.includes(f)).map(f=>{\n        const active=s.modal.tab===f;\n        return { id:f, label:this.FMT[f].label, color:this.FMT[f].color,\n          style: active?`background:#fff;color:${this.FMT[f].color};box-shadow:0 2px 7px rgba(20,22,40,.1)`:'background:#ececf1;color:#7c8089',\n          onClick:()=>this.setTab(f) };\n      });\n      const waveBars=Array.from({length:34},(_,i)=>({ h:(16+Math.round(Math.abs(Math.sin(i*0.6)+Math.cos(i*0.27))*22))+'px', delay:(i*0.04).toFixed(2)+'s' }));\n      const ex=this.excerpt(r);\n      modal={ open:true, id:r.id, title:r.title, pub:r.pub,\n        crumb: r.trade ? (this.tradeName(r.trade)+(r.level? ' · '+this.levelName(r.level):'')) : (r.short ? this.shortName(r.short) : 'General'),\n        tabs, waveBars, pageLabel:this.pageLabel(r.id), audLen:this.audLen(r.id), durLabel:this.vidLen(r.id),\n        isBook:s.modal.tab==='book', isAudio:s.modal.tab==='audio', isVideo:s.modal.tab==='video',\n        maxW: s.modal.tab==='book' ? '1040px' : '760px',\n        bodyStyle: s.modal.tab==='book' ? 'flex:1;min-height:0;overflow:hidden;background:#f6f6f9;display:flex' : 'flex:1;min-height:0;overflow-y:auto;background:#f6f6f9;padding:26px',\n        excerpt:{ chapter:ex.chapter, paras:ex.paras.map(t=>({ text:t })) },\n        video:(()=>{ const v=this.videoDetail(r); return { desc:v.desc, learn:v.learn.map(t=>({ text:t })), chapters:v.chapters }; })(),\n        close:()=>this.closeModal(), stop:(e)=>e.stopPropagation() };\n      const cm=(s.chat && s.chat.id===r.id) ? s.chat.msgs : [];\n      chatMsgs=cm.map(m=>({ text:m.text, align: m.role==='user'?'justify-content:flex-end':'justify-content:flex-start',\n        bubble: m.role==='user' ? `background:${a};color:#fff;border-bottom-right-radius:5px` : 'background:#f1f2f6;color:#2b2e38;border-bottom-left-radius:5px' }));\n      chatShowSuggestions = !s.chatBusy && cm.length<2;\n    }\n\n    return {\n      accent:a, accentSoft, accentDeep, accentShadow,\n      bookW:bookW+'px', bookH:bookH+'px', videoW:videoW+'px', videoH:videoH+'px', audioW:audioW+'px',\n      trades, shorts,\n      showMoreTrades, moreTradesLabel, moreTradesRot, noTradeMatches, onToggleMoreTrades:()=>this.toggleMoreTrades(),\n      tradeSearch:s.tradeSearch, tradeSearchOpen:s.tradeSearchOpen, onTradeSearch:(e)=>this.setTradeSearch(e), onToggleTradeSearch:()=>this.toggleTradeSearch(),\n      tradeSearchBtnBg: s.tradeSearchOpen?a:'#f4f4f7', tradeSearchBtnColor: s.tradeSearchOpen?'#fff':'#7c8089',\n      showMoreShorts, moreShortsLabel, moreShortsRot, noShortMatches, onToggleMoreShorts:()=>this.toggleMoreShorts(),\n      shortSearch:s.shortSearch, shortSearchOpen:s.shortSearchOpen, onShortSearch:(e)=>this.setShortSearch(e), onToggleShortSearch:()=>this.toggleShortSearch(),\n      shortSearchBtnBg: s.shortSearchOpen?a:'#f4f4f7', shortSearchBtnColor: s.shortSearchOpen?'#fff':'#7c8089',\n      viewChips,\n      resultLabel: total+(total===1?' result':' results'),\n      query:s.query, onQuery:(e)=>this.setQuery(e), searchPlaceholder,\n      searchBorder: scopeActive?a:'#ececf0',\n      scopeChips, scopeOptions, scopeMenuOpen:s.scopeMenu, onToggleScopeMenu:()=>this.toggleScopeMenu(),\n      scopeBtnBg: s.scopeMenu?a:'#f4f4f7', scopeBtnBorder: s.scopeMenu?a:'#ececf0', scopeBtnColor: s.scopeMenu?'#fff':'#5a5e69',\n      sections, isEmpty: sections.length===0,\n      modal,\n      chatMsgs, chatBusy:s.chatBusy, chatInput:s.chatInput, chatShowSuggestions, chatSuggestions,\n      onChatInput:(e)=>this.setChatInput(e), onChatKey:(e)=>this.onChatKey(e), onChatSend:()=>this.sendChat(),\n    };\n  }\n}\n<\u002Fscript>\n\
