services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - moodle_app:/var/www/html/moodle_app
      - ./moodledata:/var/www/moodledata
      - ./config.php.docker:/var/www/html/config.php.docker:ro
    env_file:
      - .env
    networks:
      - moodle
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cron:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - moodle_app:/var/www/html/moodle_app
      - ./moodledata:/var/www/moodledata
      - ./config.php.docker:/var/www/html/config.php.docker:ro
    env_file:
      - .env
    command: ["cron"]
    depends_on:
      - php
    networks:
      - moodle

  nginx:
    image: nginx:alpine
    ports:
      - "${MOODLE_PORT:-8080}:80"
    volumes:
      - moodle_app:/var/www/html/moodle_app:ro
    environment:
      - SDMS_URL=${SDMS_URL:-http://10.32.2.16:8082/sdms/api/REB_API/}
      - MOODLE_PORT=${MOODLE_PORT:-8080}
    depends_on:
      - php
    networks:
      - moodle

volumes:
  moodle_app:

networks:
  moodle:
