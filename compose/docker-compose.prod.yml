services:
  php:
    # Scaling: deploy.replicas is Swarm-only. Use:
    #   docker compose --project-directory . \
    #     -f compose/docker-compose.yml -f compose/docker-compose.prod.yml \
    #     up -d --scale php=${PHP_REPLICAS:-3}
    cpus: "${CPUS_PER_REPLICA:-4}"
    mem_limit: "${PHP_REPLICA_MEMORY:-12G}"
    volumes:
      - moodledata:/var/www/moodledata
      - ./config.php.docker:/var/www/html/config.php.docker:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect localhost:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # storage.reb.rw public DNS points at an IP that no longer routes to Garage; pin it to Garage's internal address.
    extra_hosts:
      - "storage.reb.rw:10.10.68.214"
    networks:
      - moodle

  cron:
    cpus: "2"
    mem_limit: "4G"
    volumes:
      - moodledata:/var/www/moodledata
      - ./config.php.docker:/var/www/html/config.php.docker:ro
    depends_on:
      - redis
    # storage.reb.rw public DNS points at an IP that no longer routes to Garage; pin it to Garage's internal address.
    extra_hosts:
      - "storage.reb.rw:10.10.68.214"
    networks:
      - moodle

  nginx:
    # SSL is terminated by an external reverse proxy that forwards HTTP here.
    # Pair with MOODLE_SSLPROXY=true in prod so Moodle emits https:// URLs.
    cpus: "2"
    mem_limit: "1G"
    ports:
      - "${MOODLE_PORT:-8080}:80"
    environment:
      - MOODLE_PORT=${MOODLE_PORT:-8080}
      - SDMS_URL=${SDMS_URL}
    volumes:
      - moodledata:/var/www/moodledata:ro
      - ./docker/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - moodle

  redis:
    cpus: "2"
    mem_limit: "3G"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - moodle

volumes:
  moodledata:
  redis_data:
