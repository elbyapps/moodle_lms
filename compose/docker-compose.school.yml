# School LMS instance overlay — self-contained, single-box deployment.
#
# This profile is image-based: school boxes pull pre-baked Moodle images from
# GHCR and do not build or clone Moodle locally. Runtime state remains local:
# bundled MariaDB, Redis, and local-filesystem moodledata. There is no garage,
# no S3/objectfs dependency, and no source-tree bind mount.
#
# Important Compose merge detail: compose/docker-compose.yml defines build:
# stanzas for php and nginx. We must remove those inherited build definitions
# with `build: !reset null`, otherwise a school deploy can accidentally try to
# build on the school VM again.

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME:-moodle}
      - MARIADB_USER=${DB_USER:-moodleuser}
      - MARIADB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - moodle

  php:
    image: ghcr.io/elbyapps/moodle_lms-php:${IMAGE_TAG:-rtb}
    build: !reset null
    restart: unless-stopped
    volumes: !override
      - ./moodledata:/var/www/moodledata
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  cron:
    image: ghcr.io/elbyapps/moodle_lms-php:${IMAGE_TAG:-rtb}
    restart: unless-stopped
    volumes: !override
      - ./moodledata:/var/www/moodledata
    depends_on:
      php:
        condition: service_started
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: ghcr.io/elbyapps/moodle_lms-nginx:${IMAGE_TAG:-rtb}
    build: !reset null
    restart: unless-stopped
    volumes: !override
      - ./moodledata:/var/www/moodledata:ro

  redis:
    restart: unless-stopped

volumes:
  mariadb_data:

networks:
  moodle:
