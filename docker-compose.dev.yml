# Development compose file - adds MariaDB and bind mounts for plugin development
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        SKIP_CLONE: "true"
    volumes:
      - ./moodle_app:/var/www/html/moodle_app
      - ./moodledata:/var/www/moodledata
      - ./config.php.docker:/var/www/html/config.php.docker:ro
    environment:
      - MOODLE_ADMIN_USER=${MOODLE_ADMIN_USER:-admin}
      - MOODLE_ADMIN_PASS=${MOODLE_ADMIN_PASS:-Admin123!}
      - MOODLE_ADMIN_EMAIL=${MOODLE_ADMIN_EMAIL:-admin@example.com}
      - MOODLE_SITE_FULLNAME=${MOODLE_SITE_FULLNAME:-Moodle Dev}
      - MOODLE_SITE_SHORTNAME=${MOODLE_SITE_SHORTNAME:-moodle}

  nginx:
    volumes:
      - ./moodle_app:/var/www/html/moodle_app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  mariadb:
    image: mariadb:11
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpass}
      - MARIADB_DATABASE=${DB_NAME:-moodle}
      - MARIADB_USER=${DB_USER:-moodleuser}
      - MARIADB_PASSWORD=${DB_PASSWORD:-moodlepass}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - moodle

volumes:
  mariadb_data:
