# Development compose file - adds MariaDB and bind mounts for plugin development
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:

  mariadb:
    image: mariadb:11
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpass}
      - MARIADB_DATABASE=${DB_NAME:-moodle}
      - MARIADB_USER=${DB_USER:-moodleuser}
      - MARIADB_PASSWORD=${DB_PASSWORD:-moodlepass}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - moodle

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        SKIP_CLONE: "true"
    volumes:
      - ./moodle_app:/var/www/html/moodle_app
      - ./moodledata:/var/www/moodledata
      - ./config.php.docker:/var/www/html/config.php.docker:ro
    environment:
      - DB_TYPE=${DB_TYPE:-mariadb}
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-moodle}
      - DB_USER=${DB_USER:-moodleuser}
      - DB_PASSWORD=${DB_PASSWORD:-moodlepass}
      - DB_PREFIX=${DB_PREFIX:-mdl_}
      - MOODLE_PROTOCOL=${MOODLE_PROTOCOL:-http}
      - MOODLE_HOST=${MOODLE_HOST:-localhost}
      - MOODLE_PORT=${MOODLE_PORT:-8080}
      - MOODLE_WWWROOT=${MOODLE_WWWROOT:-}
      - MOODLE_DEBUG=${MOODLE_DEBUG:-false}
      - MOODLE_MAIL_NOREPLY=${MOODLE_MAIL_NOREPLY:-}
      - MOODLE_MAIL_PREFIX=${MOODLE_MAIL_PREFIX:-}
      - MOODLE_REVERSEPROXY=${MOODLE_REVERSEPROXY:-false}
      - MOODLE_SSLPROXY=${MOODLE_SSLPROXY:-false}
      - MOODLE_ADMIN_USER=${MOODLE_ADMIN_USER:-admin}
      - MOODLE_ADMIN_PASS=${MOODLE_ADMIN_PASS:-Admin123!}
      - MOODLE_ADMIN_EMAIL=${MOODLE_ADMIN_EMAIL:-admin@example.com}
      - MOODLE_SITE_FULLNAME=${MOODLE_SITE_FULLNAME:-Moodle Dev}
      - MOODLE_SITE_SHORTNAME=${MOODLE_SITE_SHORTNAME:-moodle}
      - SDMS_URL=${SDMS_URL:-http://10.32.2.16:8082/sdms/api/REB_API/}
    networks:
      - moodle

  cron:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        SKIP_CLONE: "true"
    command: ["cron"]
    volumes:
      - ./moodle_app:/var/www/html/moodle_app
      - ./moodledata:/var/www/moodledata
      - ./config.php.docker:/var/www/html/config.php.docker:ro
    environment:
      - DB_TYPE=${DB_TYPE:-mariadb}
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-moodle}
      - DB_USER=${DB_USER:-moodleuser}
      - DB_PASSWORD=${DB_PASSWORD:-moodlepass}
      - DB_PREFIX=${DB_PREFIX:-mdl_}
      - MOODLE_PROTOCOL=${MOODLE_PROTOCOL:-http}
      - MOODLE_HOST=${MOODLE_HOST:-localhost}
      - MOODLE_PORT=${MOODLE_PORT:-8080}
      - MOODLE_WWWROOT=${MOODLE_WWWROOT:-}
      - MOODLE_DEBUG=${MOODLE_DEBUG:-false}
      - MOODLE_MAIL_NOREPLY=${MOODLE_MAIL_NOREPLY:-}
      - MOODLE_MAIL_PREFIX=${MOODLE_MAIL_PREFIX:-}
      - MOODLE_REVERSEPROXY=${MOODLE_REVERSEPROXY:-false}
      - MOODLE_SSLPROXY=${MOODLE_SSLPROXY:-false}
      - MOODLE_ADMIN_USER=${MOODLE_ADMIN_USER:-admin}
      - MOODLE_ADMIN_PASS=${MOODLE_ADMIN_PASS:-Admin123!}
      - MOODLE_ADMIN_EMAIL=${MOODLE_ADMIN_EMAIL:-admin@example.com}
      - MOODLE_SITE_FULLNAME=${MOODLE_SITE_FULLNAME:-Moodle Dev}
      - MOODLE_SITE_SHORTNAME=${MOODLE_SITE_SHORTNAME:-moodle}
      - SDMS_URL=${SDMS_URL:-http://10.32.2.16:8082/sdms/api/REB_API/}
    networks:
      - moodle

  nginx:
    image: nginx:alpine
    ports:
      - "${MOODLE_PORT:-8080}:80"
    volumes:
      - ./moodle_app:/var/www/html/moodle_app:ro
      - ./docker/nginx/dev.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - SDMS_URL=${SDMS_URL:-http://10.32.2.16:8082/sdms/api/REB_API/}
    networks:
      - moodle


volumes:
  mariadb_data:


networks:
  moodle:
